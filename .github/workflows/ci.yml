name: Finault CI/CD

on:
  push:
    branches: [main, gold/consolidation]
  pull_request:
    branches: [main, gold/consolidation]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # JavaScript Tests
  # ============================================================================
  test-js:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run vitest suite
        run: npx vitest run --coverage

      - name: Run FCS threshold tests
        run: node tests/fcs/fcs-threshold.test.js

      - name: Run integration tests
        run: npx vitest run --config agentos/__tests__/integration/vitest.config.js

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: javascript

  # ============================================================================
  # Python Tests
  # ============================================================================
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install fastapi uvicorn pydantic pydantic-settings
          pip install PyJWT

      - name: Run verifier tests
        run: |
          pytest verifier/ --cov=verifier --cov-report=xml -v

      - name: Run closepack generator tests
        run: |
          pytest closepack-generator/ --cov=closepack-generator --cov-report=xml -v
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python

  # ============================================================================
  # Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ============================================================================
  # Build
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-js, test-python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Build Docker image
        run: |
          docker build -t finault-verifier:${{ github.sha }} -f docker/Dockerfile.verifier .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            build/

  # ============================================================================
  # ZIP Verification Test
  # ============================================================================
  verify-closepack:
    name: Close Pack Verification
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate test Close Pack
        run: |
          node tools/finault-cli.js generate-test-pack --output test-pack.zip

      - name: Verify Close Pack
        run: |
          node tools/finault-cli.js verify test-pack.zip

      - name: Test replay integrity
        run: |
          node tools/finault-cli.js replay test-pack.zip --compare

  # ============================================================================
  # Deploy (on main branch)
  # ============================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, verify-closepack, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://api.finault.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add deployment steps here
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Notify deployment
        run: |
          echo "Deployment complete"
