name: Finault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gateway exists and is correct size
        run: |
          LINES=$(wc -l < apps/gateway/gateway-wired.js)
          echo "Gateway: $LINES lines"
          if [ "$LINES" -lt 40000 ]; then
            echo "FAIL: Gateway is $LINES lines. Expected 47,000+."
            exit 1
          fi
          echo "PASS: Gateway is $LINES lines."

      - name: All 42 build functions present
        run: |
          FAIL=0
          for func in \
            "class FinaultRouter" \
            "class FinaultRateLimiter" \
            "finaultEncrypt" \
            "finaultDecrypt" \
            "sealCanonicalize" \
            "class BudgetCounter" \
            "class SealSequencer" \
            "class DashboardStream" \
            "class SealValidator" \
            "FinaultKeyManager" \
            "scanDarkDebt" \
            "sealMerkleProof" \
            "sealVerifyProof" \
            "selectiveProof" \
            "selectMarginOptimalModel" \
            "generateAIPnL" \
            "generateMarginForensics" \
            "replayScenario" \
            "buildOfflineProof" \
            "computeQualityScore" \
            "PROVIDERS" \
            "calculateCost" \
            "revenueUsd" \
            "sealToVC" \
            "handleArticle12Export" \
            "handleColoradoSB205Export" \
            "cachedRead" \
            "accumulateCost" \
            "flushCosts" \
            "securityHeadersMiddleware" \
            "computeAttributionConfidence" \
            "fireWebhook" \
            "hmacSign" \
            "generateDailyDigest" \
            "quantifyProviderError" \
            "checkSemanticCache" \
            "generateIntelligenceReport" \
            "handleDataExport" \
            "sealsToCsv" \
            "generateUsageAnalytics" \
            "LagoConnector" \
            "KillBillConnector" \
            "generateFinaultIndex" \
            "delegateToIntelligence" \
            "d1AuthLookup"; do
            COUNT=$(grep -c "$func" apps/gateway/gateway-wired.js || true)
            if [ "$COUNT" -eq 0 ]; then
              echo "FAIL: $func not found"
              FAIL=1
            else
              echo "PASS: $func ($COUNT)"
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

      - name: Migrations present
        run: |
          COUNT=$(ls database/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migrations: $COUNT"
          if [ "$COUNT" -lt 70 ]; then
            echo "FAIL: Expected 71+ migrations, found $COUNT"
            exit 1
          fi
          echo "PASS: $COUNT migrations"

      - name: Gateway syntax check
        run: node --check apps/gateway/gateway-wired.js

      - name: No hardcoded secrets
        run: |
          FOUND=$(grep -rn "sk_live_\|sk_test_\|supabase_service_key" \
            --include="*.js" --include="*.ts" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=_archive \
            --exclude="gateway-wired.js" \
            --exclude="smoke.test.js" \
            --exclude="time-machine.js" \
            --exclude="sync.py" \
            . 2>/dev/null | wc -l)
          if [ "$FOUND" -gt 0 ]; then
            echo "FAIL: Found potential hardcoded secrets"
            grep -rn "sk_live_\|sk_test_" --include="*.js" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=_archive \
              --exclude="gateway-wired.js" --exclude="smoke.test.js" \
              --exclude="time-machine.js" --exclude="sync.py" .
            exit 1
          fi
          echo "PASS: No hardcoded secrets found (validated files excluded)"

      - name: Version is 4.2
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$VERSION" != "4.2.0" ]; then
            echo "FAIL: Version is $VERSION, expected 4.2.0"
            exit 1
          fi
          echo "PASS: Version $VERSION"
