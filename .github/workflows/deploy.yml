name: Finault Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Lint Check
        run: npm run lint --if-present || true
      - run: npm run typecheck
      - run: npm run test
      - name: Dependency Vulnerability Scan (CRITICAL - FIX 10)
        run: npm audit --audit-level=moderate
      - name: Audit Report (Reporting Only)
        if: always()
        run: npm audit --audit-level=moderate || true
      - run: npm run build
      - name: Verify Build Artifact Integrity (MEDIUM)
        run: |
          if [ ! -f dist/gateway.js ]; then
            echo "::error::Build artifact 'dist/gateway.js' not found"
            exit 1
          fi
          echo "Build artifact verified successfully"

  # ──── FIX 9 (HIGH): Automated Database Migrations with Backup & Dry Run ────
  migrate-database:
    name: Run Database Migrations
    needs: preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # FIX 9 (HIGH): Pre-migration backup step - create schema snapshot
      - name: Create Pre-Migration Schema Snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_NAME="schema_backup_${TIMESTAMP}.sql"
          echo "Creating schema snapshot: $BACKUP_NAME"
          pg_dump --schema-only "$SUPABASE_DB_URL" > "$BACKUP_NAME"
          echo "Schema snapshot created successfully"
          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV

      # FIX 9 (HIGH): Migration dry-run step before applying
      - name: Migration Dry-Run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Performing migration dry-run against ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING' }}"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run || {
            echo "::error::Migration dry-run failed. Review changes before applying."
            exit 1
          }
          echo "Dry-run completed successfully"

      # FIX 9 (HIGH): Apply migrations with rollback plan
      - name: Run Database Migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Applying migrations to ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING' }}"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all || {
            echo "::error::Migration failed. Rollback plan: restore from backup ${{ env.BACKUP_NAME }}"
            echo "To restore: psql \$SUPABASE_DB_URL < ${{ env.BACKUP_NAME }}"
            exit 1
          }
          echo "Migrations completed successfully"

      # FIX 9 (HIGH): Post-migration verification
      - name: Verify Migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Verifying migration integrity..."
          psql "$SUPABASE_DB_URL" -c "SELECT version();" || {
            echo "::error::Post-migration verification failed"
            exit 1
          }
          echo "Migration verification passed"

  # ──── FIX #10 & #11: Deploy Gateway with Secrets + Staging ────
  deploy-gateway:
    name: Deploy Gateway → Cloudflare Workers
    needs: [preflight, migrate-database]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # FIX #6: Inject runtime secrets before deploy with secret masking
      - name: Set Worker Secrets
        run: |
          # FIX 6 (CRITICAL): Add masking to prevent secrets from appearing in CI/CD logs
          echo "::add-mask::${{ secrets.SUPABASE_URL }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_KEY }}"
          echo "::add-mask::${{ secrets.OPENAI_API_KEY }}"
          echo "::add-mask::${{ secrets.ANTHROPIC_API_KEY }}"
          echo "::add-mask::${{ secrets.GOOGLE_API_KEY }}"
          npm run secrets:set -- ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # FIX #11: Deploy to staging or production based on branch
          command: deploy ${{ github.ref == 'refs/heads/staging' && '--env staging' || '' }}

      - name: Post-Deploy Health Check (MEDIUM)
        run: |
          sleep 5
          URL="https://${{ github.ref == 'refs/heads/main' && 'api.finault.ai' || 'staging-api.finault.ai' }}/health"
          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$response" = "200" ]; then
              echo "Worker deployment health check passed"
              exit 0
            fi
            echo "Health check attempt $attempt failed (HTTP $response), retrying..."
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "::warning::Worker deployment health check failed after $max_attempts attempts"

  deploy-pages:
    name: Deploy Frontend → Cloudflare Pages
    needs: preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # FIX #11: Branch-based deployment (staging branch → preview, main → production)
          command: pages deploy static --project-name finault-site --branch ${{ github.ref_name }}

  deploy-verifier:
    name: Deploy Verifier → Fly.io
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set Fly Secrets
        run: |
          # FIX 6 (CRITICAL): Add masking to prevent secrets from appearing in logs
          echo "::add-mask::${{ secrets.SUPABASE_URL }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_KEY }}"
          flyctl secrets set SUPABASE_URL="${{ secrets.SUPABASE_URL }}" SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" --app finault-verifier
        working-directory: apps/verifier-service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy
        working-directory: apps/verifier-service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Post-deploy smoke test
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: [deploy-gateway, deploy-pages]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Test Gateway Health
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            URL="https://api.finault.ai"
            DASHBOARD_URL="https://app.finault.ai"
          else
            URL="https://staging-api.finault.ai"
            DASHBOARD_URL="https://staging.finault.ai"
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          if [ "$response" != "200" ]; then
            echo "::error::Gateway health check failed with status $response"
            exit 1
          fi
          echo "Gateway health check passed ($response)"

      - name: Test Dashboard
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DASHBOARD_URL="https://app.finault.ai"
          else
            DASHBOARD_URL="https://staging.finault.ai"
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" "$DASHBOARD_URL/")
          if [ "$response" != "200" ]; then
            echo "::error::Dashboard health check failed with status $response"
            exit 1
          fi
          echo "Dashboard health check passed ($response)"

      - name: Code Coverage Report (MEDIUM)
        if: always()
        run: |
          echo "::notice::Code coverage and test results available in build logs"

      - name: Deploy Notification
        if: success()
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "::notice::Successfully deployed to $ENV"

  rollback:
    name: Emergency Rollback
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [smoke-test, deploy-gateway, deploy-pages]
    # FIX 7 (HIGH): Explicit dependency on smoke-test ensures rollback only runs after full deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rollback Gateway
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: rollback --message "Automated rollback due to smoke test failure"
