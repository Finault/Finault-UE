name: Gateway CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/gateway/**'
      - 'tests/gateway-test-suite.js'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/gateway/**'
      - 'tests/gateway-test-suite.js'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: LINT & VALIDATE
  # ═══════════════════════════════════════════════════════════════════════════

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check JavaScript syntax
        run: |
          find apps/gateway/src -name "*.js" -exec node --check {} \;

      - name: Validate wrangler.toml
        run: |
          if command -v npx &> /dev/null; then
            npx wrangler publish --dry-run || true
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: TEST
  # ═══════════════════════════════════════════════════════════════════════════

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Gateway Test Suite
        run: |
          if [ -f tests/gateway-test-suite.js ]; then
            node tests/gateway-test-suite.js
          else
            echo "Test suite not found, skipping"
          fi
        env:
          GATEWAY_URL: https://api-staging.finault.ai
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: BUILD
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    name: Build Gateway
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install esbuild
        run: npm install --save-dev esbuild

      - name: Build Gateway
        run: |
          cd apps/gateway
          node scripts/build.js

      - name: Verify Build Artifacts
        run: |
          cd apps/gateway
          if [ ! -f gateway-wired.js ]; then
            echo "❌ gateway-wired.js not found"
            exit 1
          fi

          # Check file size
          SIZE=$(stat -c%s gateway-wired.js)
          if [ $SIZE -lt 1000 ]; then
            echo "❌ gateway-wired.js is too small"
            exit 1
          fi

          # Syntax check
          node --check gateway-wired.js
          echo "✓ Build verification passed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-wired
          path: apps/gateway/gateway-wired.js
          retention-days: 30

      - name: Report build metrics
        run: |
          SIZE=$(stat -c%s apps/gateway/gateway-wired.js)
          echo "Gateway bundle size: $(( SIZE / 1024 )) KB"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: SECURITY CHECKS
  # ═══════════════════════════════════════════════════════════════════════════

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for hardcoded secrets
        run: |
          set +e
          if grep -r "SUPABASE_KEY=\|OPENAI_API_KEY=\|JWT_SECRET=" \
             apps/gateway/ --include="*.js" | grep -v "env\." | grep -v "process.env"; then
            echo "❌ Hardcoded secrets found!"
            exit 1
          fi
          set -e
          echo "✓ No hardcoded secrets detected"

      - name: Check dependency versions
        run: |
          cd apps/gateway
          npm audit --audit-level=moderate || true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: DEPLOY (Only on main branch)
  # ═══════════════════════════════════════════════════════════════════════════

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.finault.ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install wrangler
        run: npm install -g @cloudflare/wrangler

      - name: Build Gateway
        run: |
          cd apps/gateway
          npm install --save-dev esbuild
          node scripts/build.js

      - name: Deploy to Cloudflare Workers
        run: |
          cd apps/gateway
          npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run smoke tests
        run: |
          echo "Waiting for deployment to be live..."
          sleep 10

          # Test health endpoint
          HEALTH=$(curl -s https://api.finault.ai/v1/health | jq .status)
          if [ "$HEALTH" != '"ok"' ]; then
            echo "❌ Health check failed"
            exit 1
          fi
          echo "✓ Health check passed"
        timeout-minutes: 5

      - name: Notify deployment success
        if: success()
        run: |
          echo "✓ Deployment successful"
          echo "Gateway version: 4.1.0"
          echo "Deployed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6: PERFORMANCE CHECK (Optional)
  # ═══════════════════════════════════════════════════════════════════════════

  performance:
    name: Performance Checks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gateway-wired

      - name: Check bundle size
        run: |
          SIZE=$(stat -c%s gateway-wired.js)
          SIZE_KB=$(( SIZE / 1024 ))

          # Fail if over 500 KB
          if [ $SIZE_KB -gt 500 ]; then
            echo "❌ Bundle size ${SIZE_KB}KB exceeds limit (500KB)"
            exit 1
          fi

          echo "✓ Bundle size check passed: ${SIZE_KB}KB"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 7: SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════

  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✓ All checks passed"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✓ Gateway CI/CD checks passed\n- Linting: passed\n- Tests: passed\n- Build: passed\n- Security: passed'
            })
