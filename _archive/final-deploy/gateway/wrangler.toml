# ═══════════════════════════════════════════════════════════════════
# FINAULT GATEWAY - Cloudflare Workers Configuration
# ═══════════════════════════════════════════════════════════════════

name = "finault-gateway"
main = "gateway.js"
compatibility_date = "2024-01-01"

# Production route
# routes = [
#   { pattern = "gateway.finault.ai/*", zone_name = "finault.ai" }
# ]

# Environment variables (set via wrangler secret)
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# RESEND_API_KEY
# SUPABASE_URL
# SUPABASE_KEY

# KV Namespace for caching and rate limiting
# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxx"

# D1 Database for usage tracking
# [[d1_databases]]
# binding = "DB"
# database_name = "finault-gateway"
# database_id = "xxx"

[vars]
ENVIRONMENT = "production"

# Development overrides
[env.dev]
name = "finault-gateway-dev"
[env.dev.vars]
ENVIRONMENT = "development"
