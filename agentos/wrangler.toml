# Finault AgentOS - Cloudflare Workers Configuration
name = "finault-agentos"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain routes
routes = [
  { pattern = "agents.finault.ai/*", zone_name = "finault.ai" }
]

[vars]
AGENTOS_VERSION = "1.0.0-gold"

# Secrets (set via wrangler secret put):
# - SUPABASE_URL
# - SUPABASE_KEY
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY
# - JWT_SECRET
