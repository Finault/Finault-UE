name = "finault-proxy"
type = "javascript"
account_id = "YOUR_ACCOUNT_ID"
workers_dev = true
route = "gateway.finault.ai/*"
zone_id = "YOUR_ZONE_ID"

# Service Binding to Intelligence Worker
[[services]]
binding = "INTELLIGENCE"
service = "finault-intelligence"
environment = "production"

# Durable Objects for rate limiting and budget tracking
[[durable_objects.bindings]]
name = "RATE_LIMIT_STORE"
class_name = "RateLimitStore"
script_name = "finault-proxy"

[[durable_objects.bindings]]
name = "BUDGET_STORE"
class_name = "BudgetStore"
script_name = "finault-proxy"

# KV Namespaces
[[kv_namespaces]]
binding = "PROVIDER_KEYS"
id = "YOUR_PROVIDER_KEYS_KV_ID"
preview_id = "YOUR_PROVIDER_KEYS_PREVIEW_ID"

[[kv_namespaces]]
binding = "CUSTOMER_CACHE"
id = "YOUR_CUSTOMER_CACHE_KV_ID"
preview_id = "YOUR_CUSTOMER_CACHE_PREVIEW_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_RATE_LIMIT_KV_ID"
preview_id = "YOUR_RATE_LIMIT_PREVIEW_ID"

[[kv_namespaces]]
binding = "BUDGET_KV"
id = "YOUR_BUDGET_KV_ID"
preview_id = "YOUR_BUDGET_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "GATEWAY_LOGS"
id = "YOUR_GATEWAY_LOGS_KV_ID"
preview_id = "YOUR_GATEWAY_LOGS_PREVIEW_ID"

[[kv_namespaces]]
binding = "TRANSACTION_LOG"
id = "YOUR_TRANSACTION_LOG_KV_ID"
preview_id = "YOUR_TRANSACTION_LOG_PREVIEW_ID"

# Analytics Engine
[analytics_engine_datasets]
binding = "ANALYTICS"

# Environment variables
[env.production]
route = "gateway.finault.ai/*"
zone_id = "YOUR_ZONE_ID"
vars = { ENVIRONMENT = "production", LOG_LEVEL = "info" }

[env.staging]
route = "staging-gateway.finault.ai/*"
zone_id = "YOUR_ZONE_ID"
vars = { ENVIRONMENT = "staging", LOG_LEVEL = "debug" }

# Build configuration
[build]
cwd = "."
command = "npm install && npm run build"
watch_paths = ["src/**/*.js"]

[build.upload]
format = "service-worker"
main = "./proxy.js"

# Triggers for scheduled maintenance
[[triggers.crons]]
cron = "0 * * * *"  # Every hour
handler = "cleanupExpiredBudgets"

[[triggers.crons]]
cron = "0 0 * * *"  # Daily at midnight
handler = "generateDailyReport"
