# Prometheus Configuration for Finault

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Finault Verifier API
  - job_name: 'finault-verifier'
    static_configs:
      - targets: ['verifier:8000']
    metrics_path: /metrics

  # Finault Gateway
  - job_name: 'finault-gateway'
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: /metrics

  # PostgreSQL (via postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
