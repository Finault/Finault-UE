[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finault-sdk"
version = "1.0.0"
description = "Official Finault AgentOS Python SDK — AI cost governance, invoice reconciliation, and FinOps automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Finault Inc.", email = "sdk@finault.ai"}
]
keywords = ["finault", "finops", "ai-cost", "cloud-cost", "governance", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial"
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[project.urls]
Homepage = "https://finault.ai"
Documentation = "https://docs.finault.ai/sdk/python"
Repository = "https://github.com/finault/sdk-python"
Issues = "https://github.com/finault/sdk-python/issues"

[tool.hatch.build.targets.sdist]
include = ["finault_sdk/"]

[tool.hatch.build.targets.wheel]
packages = ["finault_sdk"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true
