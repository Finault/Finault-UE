<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finault Live Close Pack</title>
<meta name="description" content="Real-time AI financial summary — always current, always sealed.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f8f9fb;color:#1e293b;line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:720px;margin:0 auto;padding:40px 20px 60px}
.top-badge{text-align:center;margin-bottom:24px}
.top-badge span{display:inline-flex;align-items:center;gap:6px;background:#1a1625;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:0.02em}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:4px}
.header .subtitle{font-size:13px;color:#64748b}
.card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:20px 24px;margin-bottom:12px}
.card h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.metric{text-align:center;padding:12px;background:#f8f9fb;border-radius:8px}
.metric .val{font-size:20px;font-weight:800;color:#0f172a}
.metric .lbl{font-size:11px;color:#64748b;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}
.row .label{color:#64748b;font-size:12px;font-weight:500}
.row .value{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;font-size:12px;color:#1e293b;text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-green{background:#f0fdf4;color:#166534}
.badge-red{background:#fef2f2;color:#991b1b}
.footer{text-align:center;margin-top:28px;padding-top:20px;border-top:1px solid #e5e7eb}
.footer p{font-size:11px;color:#94a3b8}
.footer a{color:#16a34a;text-decoration:none;font-weight:500}
.loading{text-align:center;padding:80px 20px}
.loading h2{font-size:16px;color:#64748b;margin-bottom:8px}
.error-state{text-align:center;padding:80px 20px}
.error-state h2{font-size:18px;color:#dc2626;margin-bottom:8px}
.error-state p{font-size:13px;color:#64748b}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <h2>Loading Live Close Pack...</h2>
    <p style="font-size:12px;color:#94a3b8">Fetching real-time financial summary</p>
  </div>
</div>

<script>
(function(){
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  if (!token) {
    document.getElementById('app').innerHTML = '<div class="error-state"><h2>Access Required</h2><p>This page requires a close pack token.<br>URL format: /close-pack?token=cpk_xxxxx</p></div>';
    return;
  }

  fetch('/v1/close-pack/live', {
    headers: { 'X-Finault-Key': token, 'x-api-key': token }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('API returned ' + r.status);
    return r.json();
  })
  .then(function(data) { render(data); })
  .catch(function(err) {
    document.getElementById('app').innerHTML = '<div class="error-state"><h2>Failed to Load</h2><p>' + err.message + '</p><p style="margin-top:12px"><a href="https://finault.ai" style="color:#16a34a">Back to Finault</a></p></div>';
  });

  function render(d) {
    var asOf = d.as_of ? new Date(d.as_of).toLocaleString() : 'Unknown';
    var ec = d.economics || {};
    var ag = d.agents || {};
    var ch = d.chain || {};
    var gov = d.governance || {};
    var sav = d.savings || {};

    var html = '';
    html += '<div class="top-badge"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> Finault Live Close Pack</span></div>';
    html += '<div class="header"><h1>AI Financial Summary</h1><div class="subtitle">As of ' + asOf + '</div></div>';

    // Economics
    html += '<div class="card"><h2>Economics — 30 Day Summary</h2>';
    html += '<div class="metrics">';
    html += '<div class="metric"><div class="val">$' + (ec.total_spend || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) + '</div><div class="lbl">Total Spend</div></div>';
    html += '<div class="metric"><div class="val">' + (ec.total_calls || 0).toLocaleString() + '</div><div class="lbl">API Calls</div></div>';
    html += '<div class="metric"><div class="val">$' + (ec.avg_cost_per_call || 0).toFixed(4) + '</div><div class="lbl">Avg Cost/Call</div></div>';
    html += '</div>';
    html += '<div class="row"><span class="label">Models Used</span><span class="value">' + (ec.models_used || 0) + '</span></div>';
    html += '<div class="row"><span class="label">Providers</span><span class="value">' + (ec.providers_used || 0) + '</span></div>';
    html += '</div>';

    // Agents
    html += '<div class="card"><h2>Agent Fleet</h2>';
    html += '<div class="metrics">';
    html += '<div class="metric"><div class="val">' + (ag.total || 0) + '</div><div class="lbl">Total Agents</div></div>';
    html += '<div class="metric"><div class="val" style="color:#16a34a">' + (ag.active || 0) + '</div><div class="lbl">Active</div></div>';
    html += '<div class="metric"><div class="val" style="color:#94a3b8">' + (ag.dormant || 0) + '</div><div class="lbl">Dormant</div></div>';
    html += '</div>';
    html += '<div class="row"><span class="label">Total Imprints</span><span class="value">' + (ag.total_imprints || 0) + '</span></div>';
    html += '</div>';

    // Governance (if present)
    if (gov.finault_score !== undefined) {
      html += '<div class="card"><h2>Governance</h2>';
      html += '<div class="row"><span class="label">Finault Score</span><span class="value" style="font-weight:700;font-size:16px">' + gov.finault_score + '</span></div>';
      html += '<div class="row"><span class="label">Grade</span><span class="value"><span class="badge ' + (gov.grade === 'A' || gov.grade === 'B' ? 'badge-green' : 'badge-red') + '">' + gov.grade + '</span></span></div>';
      if (gov.weakest_dimension) html += '<div class="row"><span class="label">Weakest Dimension</span><span class="value">' + gov.weakest_dimension + '</span></div>';
      html += '</div>';
    }

    // Savings (if present)
    if (sav.monthly_recoverable) {
      html += '<div class="card"><h2>Savings Opportunities</h2>';
      html += '<div class="row"><span class="label">Monthly Recoverable</span><span class="value" style="font-weight:700;color:#16a34a">$' + (sav.monthly_recoverable || 0).toLocaleString(undefined, {minimumFractionDigits:2}) + '</span></div>';
      html += '<div class="row"><span class="label">Recommendations</span><span class="value">' + (sav.recommendations || 0) + '</span></div>';
      html += '</div>';
    }

    // Reconciliation & Settlement (Layer 3)
    var rec = d.reconciliation || {};
    var stl = d.settlement || {};
    html += '<div class="card"><h2>Reconciliation &amp; Settlement</h2>';
    html += '<div class="metrics">';
    html += '<div class="metric"><div class="val" style="font-size:16px;text-transform:capitalize">' + (rec.mode || 'continuous') + '</div><div class="lbl">Mode</div></div>';
    html += '<div class="metric"><div class="val">' + (rec.latest_variance_pct || 0).toFixed(1) + '%</div><div class="lbl">Variance</div></div>';
    html += '<div class="metric"><div class="val">' + (rec.avg_match_rate || 0).toFixed(1) + '%</div><div class="lbl">Match Rate</div></div>';
    html += '</div>';
    html += '<div class="row"><span class="label">Latest Status</span><span class="value"><span class="badge badge-green">' + (rec.latest_status || 'active') + '</span></span></div>';
    html += '<div class="row"><span class="label">Certified Reports</span><span class="value">' + (rec.certified_reports || 0) + ' of ' + (rec.total_reports || 0) + '</span></div>';
    html += '<div class="row"><span class="label">Open Exceptions</span><span class="value">' + (rec.exceptions_open || 0) + '</span></div>';
    html += '<div class="row"><span class="label">Settlement</span><span class="value" style="color:#16a34a;font-weight:600">' + (stl.continuous ? 'Continuous' : 'Periodic') + '</span></div>';
    html += '</div>';

    // Chain Integrity
    html += '<div class="card"><h2>Chain Integrity</h2>';
    html += '<div class="row"><span class="label">Total Seals</span><span class="value" style="font-weight:700">' + (ch.total_seals || 0).toLocaleString() + '</span></div>';
    html += '<div class="row"><span class="label">Chain Status</span><span class="value" style="color:#16a34a;font-weight:600">&#10003; ' + (ch.chain_integrity || 'verified') + '</span></div>';
    html += '<div class="row"><span class="label">Latest Seal</span><span class="value" style="font-size:10px">' + (ch.latest_seal || '—') + '</span></div>';
    html += '<div class="row"><span class="label">Genesis Seal</span><span class="value" style="font-size:10px">' + (ch.genesis_seal || '—') + '</span></div>';
    html += '<div class="row"><span class="label">Algorithm</span><span class="value">Self-Sovereign (SHA-256)</span></div>';
    html += '</div>';

    // Footer
    html += '<div class="footer">';
    html += '<div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span style="font-size:14px;font-weight:800;color:#1a1625;letter-spacing:-0.02em">Finault</span></div>';
    html += '<p>This data is derived from <strong>' + (ch.total_seals || 0).toLocaleString() + '</strong> cryptographically sealed receipts.</p>';
    html += '<p style="margin-top:4px"><a href="/v1/chain/verify">Verify the chain &#8594;</a></p>';
    html += '<p style="margin-top:8px"><a href="https://finault.ai">finault.ai</a></p>';
    html += '</div>';

    document.getElementById('app').innerHTML = html;
  }
})();
</script>
</body>
</html>
