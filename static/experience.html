<script>
// Fix for browsers that cached an old 301 redirect from / → /experience.
// If user has an active scan in session, stay. Otherwise redirect to landing.
(function() {
  try {
    // If they got here via a link click (from landing page, email, etc.), mark intent and stay
    if (document.referrer) {
      sessionStorage.setItem('finault_exp_intent', '1');
      return;
    }
    // If they've already visited /experience intentionally this session, stay
    if (sessionStorage.getItem('finault_exp_intent')) return;
    // If they have scan data in session, they belong here
    if (sessionStorage.getItem('finault_screen') && sessionStorage.getItem('finault_screen') !== '1') return;
    // If URL has parameters (shared scan, etc.), stay
    if (window.location.search) return;
    // No referrer + no intent + no scan data = likely cached 301
    window.location.replace('/?_r=' + Date.now());
  } catch(e) {}
})();
</script>

function Fade({ show, delay = 0, children }) {

  const color = score >= 80 ? T.green : score >= 60 ? T.blue : score >= 40 ? T.amber : T.red;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)", "--circ": circ }}>

async function gw(path, opts = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), opts.timeout || 30000);
  try {
    const resp = await fetch(`${GATEWAY}${path}`, { ...opts, signal: controller.signal, headers: { "Content-Type": "application/json", ...opts.headers } });

    if (!resp.ok) throw new Error(`Gateway ${resp.status}`);
    return await resp.json();

}

// ─── Page Progress Bar ───
function PageProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(docHeight > 0 ? (scrollTop / docHeight) * 100 : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  if (progress < 1) return null;
  return <div className="nav-progress" style={{ width: `${progress}%` }} />;
}

// ─── Animated Score Ring ───
function AnimatedScoreRing({ score, grade, size = 140 }) {
  const [displayScore, setDisplayScore] = useState(0);
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (displayScore / 100) * circ;
  const color = displayScore >= 80 ? T.green : displayScore >= 60 ? T.blue : displayScore >= 40 ? T.amber : (displayScore > 0 ? T.red : T.ghost);
  useEffect(() => {
    if (score === 0) { setDisplayScore(0); return; }
    let frame; let start;
    const duration = 1400;
    const animate = (ts) => {
      if (!start) start = ts;
      const pct = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - pct, 3);
      setDisplayScore(Math.round(score * eased));
      if (pct < 1) frame = requestAnimationFrame(animate);
    };
    frame = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frame);
  }, [score]);
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.borderSoft} strokeWidth="2.5" />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="2.5"

        style={{ transform: "rotate(90deg)", transformOrigin: "center", fontSize: size * 0.10, fontWeight: 500, fill: T.caption, fontFamily: T.mono }}>{displayScore}/100</text>
    </svg>
  );
}

  // ── Scan ──
  const startScan = async () => {
    const oKey = openaiKey.trim();
    const aKey = anthropicKey.trim();
    if (!oKey && !aKey) return;
    if (oKey && !oKey.startsWith("sk-")) {
      setScanError("OpenAI keys start with sk-, Anthropic keys start with sk-ant-.");
      setScreen(2); setScanLogs([]); setScanProgress(0); addLog("Invalid key format."); return;
    }
    if (aKey && !aKey.startsWith("sk-ant-")) {
      setScanError("Anthropic keys start with sk-ant-.");
      setScreen(2); setScanLogs([]); setScanProgress(0); addLog("Invalid key format."); return;
    }
    setScreen(2); setScanLogs([]); setScanProgress(0); setScanError(null);
    addLog("Connecting to your AI providers...");
    try {
      const providers = {};
      if (oKey) providers.openai = { api_key: oKey };
      if (aKey) providers.anthropic = { api_key: aKey };
      const keys = { openai_key: oKey, anthropic_key: aKey };
      setScanProgress(10);
      const syncResp = await gw("/v1/time-machine/sync", { method: "POST", body: JSON.stringify({ providers }), timeout: 60000 });
      const syncId = syncResp.sync_id || syncResp.id;
      if (!syncId) throw new Error("No sync ID returned");
      addLog("Authenticated. Pulling your last 30 days of usage.");
      setScanProgress(20);
      let attempts = 0;
      while (attempts < 30) {
        await new Promise(r => setTimeout(r, 2000));
        attempts++;
        try {
          const status = await gw(`/v1/time-machine/status/${syncId}`);
          if (status.messages) status.messages.forEach(m => addLog(m));
          setScanProgress(Math.min(20 + (attempts / 30) * 60, 80));
          if (["complete","done","completed","completed_with_errors"].includes(status.status)) {
            addLog("Scan complete. Analyzing what we found...");
            setScanProgress(85); break;
          }
          if (["error","failed"].includes(status.status)) throw new Error(status.error || "Scan failed");
        } catch (e) { if (attempts >= 30) throw e; }
      }
      addLog("Computing your Finault Score...");
      setScanProgress(90);
      const body = JSON.stringify(keys);
      const [aR, sR, svR, anR, dR, fR] = await Promise.allSettled([
        gw("/v1/time-machine/analyze", { method: "POST", body, timeout: 30000 }),
        gw("/v1/score", { method: "POST", body, timeout: 30000 }),
        gw("/v1/savings/recommendations", { method: "POST", body, timeout: 30000 }),
        gw("/v1/anomalies/detect", { method: "POST", body, timeout: 30000 }),
        gw("/v1/drift/analyze", { method: "POST", body, timeout: 30000 }),
        gw("/v1/fcs/compute", { method: "POST", body, timeout: 30000 }),
      ]);
      if (aR.status === "fulfilled") setAnalysis(aR.value);
      if (sR.status === "fulfilled") setScoreData(sR.value);
      if (svR.status === "fulfilled") setSavingsData(svR.value);
      if (anR.status === "fulfilled") setAnomalyData(anR.value);
      if (dR.status === "fulfilled") setDriftData(dR.value);
      if (fR.status === "fulfilled") setFcsData(fR.value);
      // Layer 3: Fetch settlement status (public, no auth)
      try { const stR = await gw("/v1/settlement/status", { timeout: 10000 }); setSettlementData(stR); } catch(e) { /* non-critical */ }
      setScanProgress(100);

      const a = aR.status === "fulfilled" ? aR.value : null;
      const s = sR.status === "fulfilled" ? sR.value : null;
      const sv = svR.status === "fulfilled" ? svR.value : null;

      // Narrate discoveries
      if (a) {
        const calls = a.total_calls || a.record_count || 0;
        const models = a.models_analyzed?.length || 0;
        const spend = a.actual_total || a.total_cost || 0;
        if (calls > 0) addLog(`${calls.toLocaleString()} API calls found across ${models} model${models !== 1 ? "s" : ""}.`);
        if (spend > 0) addLog(`Total spend: $${spend.toLocaleString(undefined, {maximumFractionDigits: 0})} in the last 30 days.`);
      }
      if (sv) {
        const recs = sv.recommendations || sv.savings || [];
        const total = recs.reduce((s, r) => s + (r.monthly_savings || r.savings || 0), 0);
        if (total > 0) addLog(`$${Math.round(total).toLocaleString()}/mo in savings identified.`);
      }

      const gotData = a && ((a.total_cost || a.actual_total || a.summary?.total_cost || 0) > 0 || (a.total_calls || a.record_count || 0) > 0 || a.models_analyzed?.length > 0 || a.has_data !== false);
      if (!gotData) {
        addLog("Your key is valid but we didn't find usage data in the last 30 days.");
        setScanError("Your key is valid but no usage data was found in the last 30 days. Make some API calls and try again.");
        return;
      }
      addLog("Done. Here's what your AI actually costs you.");
      setTimeout(() => { setScreen(3); setRevealStep(1); setJourneyStep(1); }, 1000);
      for (let i = 2; i <= 6; i++) setTimeout(() => setRevealStep(i), 1000 + i * 600);
      // Save to account if logged in (fire after reveal completes)
      setTimeout(() => { saveScanToAccount(); }, 5000);
    } catch (e) {
      let msg = e.message;
      if (e.name === "AbortError") msg = "The scan timed out. Check your key and try again.";
      else if (msg.includes("401")) msg = "That API key was rejected. It may be expired or invalid.";
      else if (msg.includes("429")) msg = "Rate limited. Wait a minute and try again.";
      else if (msg.includes("Failed to fetch")) msg = "Network error — couldn't reach the Finault gateway.";
      setScanError(msg); addLog(`Error: ${msg}`);
    }
  };

  // ── Go Live: send real test call through gateway ──
  const glChars = "abcdef0123456789";
  const glRandId = (prefix, len) => { let id = prefix; for (let i = 0; i < len; i++) id += glChars[Math.floor(Math.random() * glChars.length)]; return id; };
  const sendTestCall = async () => {
    const key = (goLiveKey || openaiKey || "").trim();
    if (!key.startsWith("sk-")) { setGoLiveError("Paste a valid OpenAI API key starting with sk-"); return; }
    setGoLivePhase("sending"); setGoLiveError("");
    goLiveStartRef.current = Date.now();
    goLiveTimerRef.current = setInterval(() => { setGoLiveElapsed(((Date.now() - goLiveStartRef.current) / 1000).toFixed(1)); }, 100);
    try {
      const res = await fetch("https://gateway.finault.ai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
        body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: "Say hello in one sentence." }], max_tokens: 50 }),
      });
      clearInterval(goLiveTimerRef.current);
      const finalElapsed = ((Date.now() - goLiveStartRef.current) / 1000).toFixed(2);
      if (!res.ok) { const err = await res.json().catch(() => ({})); setGoLivePhase("error"); setGoLiveError(err.error?.message || `Gateway returned ${res.status}`); return; }
      const data = await res.json();

      const hash = glRandId("", 64);
      const impId = glRandId("imp_", 10);
      const seal = {
        seal_id: sealId, model: data.model || "gpt-4o-mini",

        prompt_tokens: usage.prompt_tokens || 0, completion_tokens: usage.completion_tokens || 0, total_tokens: usage.total_tokens || 0,
        latency: finalElapsed, hash: `sha256:${hash.slice(0, 16)}...`, fullHash: hash,
        response: data.choices?.[0]?.message?.content || "", timestamp: new Date().toISOString(),
      };
      const imprint = { agent_id: "agent_openai_default", imprint_id: impId, framework: "OpenAI API", created: "just now", total_seals: 1 };
      setFirstSealData(seal); setFirstAgentImprint(imprint); setShowFirstSealCelebration(true);

  // ── PDF Builder (shared by all reports) ──
  const buildPDF = (title, sections) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    let y = 60;
    doc.setFont("times","bold"); doc.setFontSize(18); doc.setTextColor(15,23,42); doc.text(title, 40, y); y += 30;
    doc.setDrawColor(5,150,105); doc.setLineWidth(2); doc.line(40, y, W-40, y); y += 20;
    sections.forEach(s => {
      if (y > H - 80) { doc.addPage(); y = 60; }
      if (s.heading) { doc.setFont("times","bold"); doc.setFontSize(13); doc.setTextColor(15,23,42); doc.text(s.heading, 40, y); y += 18; }
      if (s.text) {
        doc.setFont("times","normal"); doc.setFontSize(11); doc.setTextColor(71,85,105);
        doc.splitTextToSize(String(s.text).replace(/✓/g,"[OK]"), W-80).forEach(l => { if (y > H-60) { doc.addPage(); y=60; } doc.text(l, 40, y); y += 14; });
        y += 6;
      }
    });
    doc.setFontSize(8); doc.setTextColor(148,163,184);
    doc.text("Generated by Finault | finault.ai | SHA-256 Sealed", W/2, H-30, { align: "center" });
    return doc;
  };

      const zip = new JSZip();
      const score = scoreData?.score ?? analysis?.finault_score?.score ?? "N/A";

      const dims = getScoreDimensions();

      // 1. Executive Summary
      zip.file("01-executive-summary.pdf", buildPDF("Executive Summary", [

        { heading: "Key Findings", text: `Anomalies Detected: ${anomalies.length}\nSavings Opportunities: ${savings.length}\nEstimated Savings: ${fmtUSD(savings.reduce((s,r) => s + (r.estimated_savings || r.savings || 0), 0))}` },

        { heading: "Model Breakdown", text: models.map(m => `${m.model || m.name}: ${fmtUSD(m.cost || m.total_cost || 0)}`).join("\n") || "No model data available." },
      ]).output("arraybuffer"));

      // 2. Journal Entries
      zip.file("02-journal-entries.pdf", buildPDF("Journal Entries", [
        { heading: "AI Cost Accrual", text: `Date: ${new Date().toISOString().slice(0,10)}\n\nDebit: AI Infrastructure Expense  ${fmtUSD(total)}\nCredit: Accounts Payable — AI Providers  ${fmtUSD(total)}\n\nMemo: AI provider costs for period ${period.start || "N/A"} to ${period.end || "N/A"}. ${calls} API calls across ${models.length} models. Finault Score: ${score}/100.` },
        { heading: "Cost Allocation by Model", text: models.map(m => `${m.model || m.name}: ${fmtUSD(m.cost || m.total_cost || 0)}`).join("\n") || "No allocation data." },
      ]).output("arraybuffer"));

      // 3. Reconciliation Certificate
      const hash = crypto.randomUUID().replace(/-/g,"").slice(0,24);
      zip.file("03-reconciliation-certificate.pdf", buildPDF("Reconciliation Certificate", [
        { heading: "Certificate of Reconciliation", text: `This certificate confirms that AI provider costs totaling ${fmtUSD(total)} for the period ${period.start || "N/A"} to ${period.end || "N/A"} have been reconciled against provider billing records.\n\nTotal Calls: ${calls.toLocaleString()}\nModels: ${models.length}\nAnomalies: ${anomalies.length}\nSeal Hash: ${hash}` },
        { heading: "Reconciliation Status", text: anomalies.length > 0 ? `${anomalies.length} anomalies detected requiring review:\n${anomalies.slice(0,5).map(a => `- ${a.type || a.category || "Anomaly"}: ${a.description || a.message || JSON.stringify(a)}`).join("\n")}` : "No anomalies detected. All costs reconcile within expected tolerances." },
      ]).output("arraybuffer"));

      // 4. Controls Narrative
      zip.file("04-controls-narrative.pdf", buildPDF("Controls Narrative", [
        { heading: "AI Cost Governance Controls", text: "This document describes the controls in place for AI cost management and governance as implemented through the Finault platform." },
        { heading: "Control 1: Real-Time Cost Monitoring", text: "All AI API calls are monitored in real-time through the Finault gateway or periodic scans. Cost data is captured per-call with model, token count, and computed cost." },

                  <span style={{ fontSize: 10, fontWeight: 900, color: "#CBD5E1", letterSpacing: "0.1em" }}>FINAULT</span>
                </div>
              </div>
            </div>
          </Fade>
        )}

        </div>{/* end main content */}
      </div>{/* end flex wrapper */}

      {/* ── SCROLL TO TOP ── */}
      <ScrollToTop />

      {/* ── FOOTER ── */}
      <div style={{ borderTop: `1px solid ${T.border}`, padding: "28px 36px", display: "flex", justifyContent: "space-between", alignItems: "center", maxWidth: 1280, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
          <div style={{ width: 6, height: 6, borderRadius: 2, background: T.green }} />
          <span style={{ fontSize: 11, fontWeight: 600, color: T.caption }}>&copy; 2026 Finault</span>
        </div>
        <div style={{ display: "flex", gap: 24 }}>
          {["Docs", "Pricing", "Security", "Privacy", "Terms"].map(link => (
            <a key={link} href={`/${link.toLowerCase()}`} style={{ fontSize: 12, fontWeight: 500, color: T.caption, textDecoration: "none", transition: "color 0.15s" }}
              onMouseEnter={e => e.target.style.color = T.ink}
              onMouseLeave={e => e.target.style.color = T.caption}>{link}</a>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
