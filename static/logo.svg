<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Finault — F with padlock on green middle bar -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="#0c0c12" />

  <!-- F stem -->
  <rect x="120" y="132" width="40" height="248" rx="6" fill="#ffffff" />

  <!-- F top bar -->
  <rect x="120" y="132" width="192" height="40" rx="6" fill="#ffffff" />

  <!-- Green middle bar — extends toward padlock -->
  <rect x="120" y="244" width="160" height="36" rx="6" fill="#16a34a" />

  <!-- Padlock body — rounded square -->
  <rect x="296" y="220" width="96" height="88" rx="18" fill="none" stroke="#16a34a" stroke-width="5" />

  <!-- Shackle -->
  <path d="M322 224 L322 196 C322 176 368 176 368 196 L368 224"
        fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" />

  <!-- Lock dot -->
  <circle cx="344" cy="268" r="8" fill="#16a34a" />
</svg>