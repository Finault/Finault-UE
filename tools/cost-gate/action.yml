name: 'Finault Cost Gate'
description: 'Checks if a PR increases AI cost-per-request beyond a configurable threshold'
author: 'Finault'

inputs:
  finault-api-key:
    description: 'Finault API key'
    required: true
  finault-base-url:
    description: 'Finault API base URL'
    required: false
    default: 'https://api.finault.ai'
  threshold-pct:
    description: 'Maximum allowed cost increase percentage (default: 50)'
    required: false
    default: '50'
  features:
    description: 'Comma-separated list of features to check (default: all)'
    required: false
    default: ''
  fail-on-increase:
    description: 'Whether to fail the check on threshold breach (default: true)'
    required: false
    default: 'true'
  period:
    description: 'Comparison period for baseline (default: 7d)'
    required: false
    default: '7d'

outputs:
  cost-report:
    description: 'JSON cost comparison report'
  has-increase:
    description: 'Whether any feature exceeds the threshold'
  max-increase-pct:
    description: 'Maximum cost increase percentage found'

runs:
  using: 'node20'
  main: 'index.js'

branding:
  icon: 'dollar-sign'
  color: 'green'
