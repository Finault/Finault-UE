name = "finault-gateway"
main = "apps/gateway/gateway-wired.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "api.finault.ai/*", zone_name = "finault.ai" }
]

[vars]
ENVIRONMENT = "production"
# SUPABASE_URL and SUPABASE_KEY are now set via `wrangler secret put`

# R2 Storage for Close Packs (immutable)
[[r2_buckets]]
binding = "CLOSEPACKS"
bucket_name = "finault-closepacks"

# KV for rate limiting and sessions
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d13878b328ce4836a0256687146a895b"

# Durable Objects — Budget, Seal Chain, Dashboard Stream
[[durable_objects.bindings]]
name = "BUDGET_COUNTER"
class_name = "BudgetCounter"

[[durable_objects.bindings]]
name = "SEAL_CHAIN"
class_name = "SealChain"

[[durable_objects.bindings]]
name = "DASHBOARD_STREAM"
class_name = "DashboardStream"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BudgetCounter", "SealChain", "DashboardStream"]

# D1 edge database for hot-path reads (model pricing, org config)
[[d1_databases]]
binding = "D1"
database_name = "finault-edge"
database_id = "9357a776-3e20-46df-9ef6-7e785d8f5fb3"

# Secrets (set via `wrangler secret put` for production)
# wrangler secret put JWT_SECRET
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET
# wrangler secret put ANCHOR_PRIVATE_KEY
# wrangler secret put INFURA_API_KEY
# wrangler secret put ALCHEMY_API_KEY
# wrangler secret put OPENAI_API_KEY
# wrangler secret put ANTHROPIC_API_KEY

[env.development]
name = "finault-gateway-dev"
[env.development.vars]
ENVIRONMENT = "development"
# SUPABASE_URL and SUPABASE_KEY must be set via: wrangler secret put SUPABASE_URL -e development
# SUPABASE_KEY must be set via: wrangler secret put SUPABASE_KEY -e development
ENABLE_DEMO_MODE = "false"
ALLOW_QUERY_ORG_ID = "false"

[[env.development.r2_buckets]]
binding = "CLOSEPACKS"
bucket_name = "finault-closepacks-dev"

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000001"

[env.staging]
name = "finault-gateway-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
ENABLE_DEMO_MODE = "false"
ALLOW_QUERY_ORG_ID = "false"
# Secrets set via: wrangler secret put SUPABASE_URL -e staging
# Secrets set via: wrangler secret put SUPABASE_KEY -e staging

[[env.staging.r2_buckets]]
binding = "CLOSEPACKS"
bucket_name = "finault-closepacks-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000001"
